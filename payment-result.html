<!doctype html><html lang="en-GH"><head><meta charset="utf-8"><link rel="icon" type="image/png" sizes="512x512" href="assets/images/favicon.png"><link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | TrotroMall</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/css/style.css"></head><body><div id="siteHeader"></div><main class="page"><div class="container auth-wrap"><section class="auth payment-result"><div id="paymentResult"><h1>Checking your payment</h1><p>Please wait while we confirm your transaction.</p></div><a class="primary-btn" href="account.html">Go to my account</a></section></div></main><div id="siteFooter"></div><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/supabase-client.js"></script><script>
(async()=>{const el=document.getElementById('paymentResult'),p=new URLSearchParams(location.search),ref=p.get('reference'),status=p.get('status');if(status==='cancelled'){el.innerHTML='<h1>Payment cancelled</h1><p>Your listing has not been promoted. No featured placement is activated.</p>';return;}if(!ref||!window.TROTRO_SUPABASE?.ready){el.innerHTML='<h1>Payment submitted</h1><p>If you completed payment, your promotion will activate after Hubtel confirms it. Check your account shortly.</p>';return;}try{const {data,error}=await TROTRO_SUPABASE.client.from('payments').select('payment_status,listing_id,created_at').eq('client_reference',ref).maybeSingle();if(error)throw error;if(data?.payment_status==='completed'){el.innerHTML='<h1>Featured listing activated</h1><p>Your payment was confirmed and your listing has been placed in the featured promotion queue for 7 days.</p>';}else if(data?.payment_status==='failed'){el.innerHTML='<h1>Payment was not completed</h1><p>No featured placement was activated. You can try again from your account.</p>';}else{el.innerHTML='<h1>Payment processing</h1><p>Hubtel is still confirming your payment. Refresh this page in a moment or check your account.</p>';}}catch(e){el.innerHTML='<h1>Payment submitted</h1><p>We are waiting for the payment confirmation from Hubtel. Please do not pay twice for the same promotion.</p>';}})();
</script></body></html>
