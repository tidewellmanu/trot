<!doctype html><html lang="en-GH"><head><meta charset="utf-8"><link rel="icon" type="image/png" sizes="512x512" href="../assets/images/favicon.png"><link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin Login | TrotroMall</title><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="admin-login-page"><div class="admin-login-card"><a href="../index.html" class="admin-login-logo"><img src="../assets/images/logo.png" alt="TrotroMall"></a><h1>Admin sign in</h1><p class="muted">Sign in with the administrator account authorised for the TrotroMall admin panel.</p><div id="adminLoginMessage" class="notice" hidden></div><form id="adminLoginForm"><div class="field"><label for="adminEmail">Email</label><input id="adminEmail" type="email" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password" required></div><button class="primary-btn" type="submit" id="adminLoginButton" style="width:100%;margin-top:16px">Sign in to admin</button></form><p class="admin-login-help">Admin access is protected by Supabase Auth and a server-side administrator allowlist.</p><a href="../index.html">Back to TrotroMall</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/supabase-client.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const form=document.getElementById('adminLoginForm'),msg=document.getElementById('adminLoginMessage'),btn=document.getElementById('adminLoginButton');const show=t=>{msg.hidden=false;msg.textContent=t;};const ready=()=>window.TROTRO_SUPABASE&&window.TROTRO_SUPABASE.ready;if(!ready()){document.addEventListener('trotro:supabase-ready',()=>{}, {once:true});setTimeout(()=>{if(!ready())show('Connect your Supabase project in assets/js/config.js before using admin login.');},700);}form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;try{if(!ready())throw new Error('Supabase is not configured. Add your project URL and publishable key to assets/js/config.js.');const c=window.TROTRO_SUPABASE.client;const email=document.getElementById('adminEmail').value.trim();const password=document.getElementById('adminPassword').value;const {error}=await c.auth.signInWithPassword({email,password});if(error)throw error;const {data:{user},error:userError}=await c.auth.getUser();if(userError||!user)throw new Error('Could not verify the signed-in account.');const {data:admin,error:roleError}=await c.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(roleError)throw new Error('Admin access check failed: '+roleError.message);if(!admin){await c.auth.signOut();throw new Error('This account is not authorised to access the admin panel.');}location.href='index.html';}catch(e){show(e.message||'Admin sign in failed.');}finally{btn.disabled=false;}});});
</script></body></html>
