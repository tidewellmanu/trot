<!doctype html><html lang="en-GH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact seller | TrotroMall</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div id="siteHeader"></div><main class="page"><div class="container"><div class="form-panel business-contact-panel"><div class="breadcrumbs">Home / Contact seller</div><h1>Contact seller</h1><p class="muted">Send the seller a message about this listing. Never share your password, OTP or payment PIN.</p><div id="listingSummary" class="notice" hidden></div><div id="messageNotice" class="notice" hidden></div><form id="sellerMessageForm"><div class="form-grid"><div class="field"><label>Your name</label><input name="sender_name" required maxlength="120"></div><div class="field"><label>Email</label><input name="sender_email" type="email" maxlength="180"></div><div class="field"><label>Phone</label><input name="sender_phone" type="tel" maxlength="30"></div><div class="field full"><label>Message</label><textarea name="body" required maxlength="4000" placeholder="Is this item still available?"></textarea></div></div><button class="primary-btn" type="submit">Send message</button></form></div></div></main><div id="siteFooter"></div><script src="assets/js/data.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/supabase-client.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get("listing_id"),notice=document.getElementById("messageNotice"),summary=document.getElementById("listingSummary"),form=document.getElementById("sellerMessageForm");const show=t=>{notice.hidden=false;notice.textContent=t;};const wait=()=>window.TROTRO_SUPABASE?.ready?Promise.resolve():new Promise(r=>document.addEventListener("trotro:supabase-ready",r,{once:true}));await wait();const c=window.TROTRO_SUPABASE.client;if(!id){show("Listing was not specified.");form.hidden=true;return;}const{data:listing,error}=await c.from("listings").select("id,title,location").eq("id",id).eq("status","active").single();if(error||!listing){show("Listing not found.");form.hidden=true;return;}summary.hidden=false;summary.textContent=listing.title+" · "+listing.location;const{data:{user}}=await c.auth.getUser();if(user){form.sender_name.value=(user.user_metadata?.full_name||user.email?.split("@")[0]||"");form.sender_email.value=user.email||"";}form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form),{error}=await c.from("messages").insert({listing_id:id,sender_id:user?.id||null,sender_name:String(fd.get("sender_name")).trim(),sender_email:String(fd.get("sender_email")).trim()||null,sender_phone:String(fd.get("sender_phone")).trim()||null,body:String(fd.get("body")).trim()});if(error){show(error.message);return;}form.reset();show("Your message has been sent to the seller.");};})();</script></body></html>
