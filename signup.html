<!doctype html><html lang="en-GH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | TrotroMall Ghana</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div id="siteHeader"></div><main class="page"><div class="container auth-wrap"><div class="auth"><h1>Create account</h1><div id="authMessage" class="notice" hidden></div><form id="signupForm"><div class="field" style="margin-bottom:12px"><label for="fullName">Full name</label><input id="fullName" name="full_name" type="text" required maxlength="100" autocomplete="name" placeholder="Your full name"></div><div class="field" style="margin-bottom:12px"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field" style="margin-bottom:12px"><label>Password</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"></div><button class="primary-btn" style="width:100%">Create account</button></form><button id="googleButton" class="contact-btn" type="button">Continue with Google</button><p style="text-align:center;color:#a1a8b3">Already have an account? <a class="link-button" href="login.html">Sign in</a></p></div></div></main><div id="siteFooter"></div><script src="assets/js/data.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/supabase-client.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const msg=document.getElementById("authMessage"),show=t=>{msg.hidden=false;msg.textContent=t;};const c=()=>window.TROTRO_SUPABASE?.client;if(!c())await new Promise(r=>document.addEventListener("trotro:supabase-ready",r,{once:true}));document.getElementById("signupForm").onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.currentTarget),{error}=await c().auth.signUp({email:f.get("email"),password:f.get("password"),options:{data:{full_name:String(f.get("full_name")||"").trim()},emailRedirectTo:location.origin+"/index.html"}});if(error)throw error;show("Account created. Check your email if confirmation is enabled.");}catch(e){show(e.message||"Could not create account.");}};document.getElementById("googleButton").onclick=async()=>{try{const{error}=await c().auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+"/index.html"}});if(error)throw error;}catch(e){show(e.message||"Google sign in is unavailable.");}};})();</script></body></html>
