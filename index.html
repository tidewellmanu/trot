<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" sizes="512x512" href="assets/images/favicon.png"><link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrotroMall Ghana | Buy and Sell Online in Ghana</title><meta name="description" content="Buy and sell cars, property, electronics, phones, fashion, jobs and services across Ghana on TrotroMall."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://trotromall.com/"><meta property="og:type" content="website"><meta property="og:site_name" content="TrotroMall"><meta property="og:title" content="TrotroMall Ghana | Buy and Sell Online in Ghana"><meta property="og:description" content="Buy and sell cars, property, electronics, phones, fashion, jobs and services across Ghana on TrotroMall."><meta property="og:url" content="https://trotromall.com/"><meta property="og:image" content="https://trotromall.com/assets/images/logo.png"><meta name="twitter:card" content="summary_large_image"><link rel="manifest" href="site.webmanifest"><link rel="stylesheet" href="assets/css/style.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"TrotroMall","url":"https://trotromall.com/","potentialAction":{"@type":"SearchAction","target":"https://trotromall.com/search.html?q={search_term_string}","query-input":"required name=search_term_string"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"TrotroMall","url":"https://trotromall.com/","logo":"https://trotromall.com/assets/images/logo.png","areaServed":{"@type":"Country","name":"Ghana"}}</script></head><body><div id="siteHeader"></div><main class="page"><div class="container"><div class="layout"><aside class="left-col"><div class="panel"><div class="panel-title">Choose a category</div><ul class="category-list" id="sideCategories"></ul></div></aside><section><div class="hero" id="homeHero"></div><section class="section"><div class="section-head"><h2>Deal of the day</h2><a href="search.html">View all</a></div><div class="deal-grid" id="deals"></div></section><section class="section"><div class="section-head"><h2>Latest listings</h2><a href="search.html">See all</a></div><div class="list-grid" id="latest"></div></section><section class="section"><div class="section-head"><h2>Categories</h2><a href="search.html">All categories</a></div><div class="panel" style="padding:16px"><div class="category-columns" id="homeCategories"></div></div></section><div class="feature-banner"><img src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1400&q=80" alt="Business advertising"></div></section><aside class="right-col"><div id="adSlider"></div><div class="newsletter"><h3>Stay up to date</h3><p>Get new offers and marketplace updates.</p><form class="inline-form" onsubmit="event.preventDefault();alert('Thank you for subscribing.')"><input type="email" placeholder="Email address" required><button class="primary-btn">Subscribe</button></form></div></aside></div></div></main><div id="siteFooter"></div><script src="assets/js/data.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/supabase-client.js"></script><script src="assets/js/app.js?v=20261003-2"></script><script>document.addEventListener('DOMContentLoaded',()=>{const D=window.TROTRO?.data||window.TROTRO_DATA||{categories:[]};document.getElementById('sideCategories').innerHTML=(D.categories||[]).slice(0,18).map(c=>`<li><a href="search.html?category=${encodeURIComponent(c.name)}">${c.name}<small>${(c.items||[]).length}</small></a></li>`).join('')})</script><script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=window.TROTRO_DATA||{settings:{siteName:'TrotroMall',currency:'GH₵'},categories:[]};
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const cats=D.categories||[];
  const side=document.getElementById('sideCategories');
  if(side)side.innerHTML=cats.slice(0,18).map(c=>'<li><a href="search.html?category='+encodeURIComponent(c.name)+'">'+esc(c.name)+'<small>'+((c.items||[]).length)+'</small></a></li>').join('');
  setTimeout(async()=>{
    const header=document.getElementById('siteHeader');
    if(header && !header.innerHTML.trim()){
      header.innerHTML='<div class="safety-banner">Buy safely: meet in public, verify goods and then make payment</div><header class="topbar"><div class="container topbar-inner"><a href="index.html" aria-label="TrotroMall home"><img class="logo" src="assets/images/logo.png" alt="TrotroMall Ghana classifieds"></a><div class="top-actions"><a class="auth-user" href="login.html">Sign in</a><a class="biz-link" href="business.html">For businesses</a><a class="add-btn" href="add-listing.html"><span aria-hidden="true">＋</span> Sell</a></div></div></header><div class="searchbar"><div class="container"><form class="search-form" onsubmit="event.preventDefault();location.href=\'search.html?q=\'+encodeURIComponent(this.q.value)+\'&category=\'+encodeURIComponent(this.category.value)"><input name="q" placeholder="What are you looking for?" aria-label="Search TrotroMall"><select name="category"><option value="">All categories</option>'+cats.map(c=>'<option>'+esc(c.name)+'</option>').join('')+'</select><select name="location"><option value="">All Ghana</option><option>Accra</option><option>Kumasi</option><option>Tema</option></select><button type="submit">Search</button></form></div></div><nav class="category-strip" aria-label="Main categories"><div class="container">'+cats.slice(0,10).map(c=>'<a href="search.html?category='+encodeURIComponent(c.name)+'">'+esc(c.name)+'</a>').join('')+'<a href="search.html">All categories</a></div></nav><nav class="mobile-bottom-nav" aria-label="Mobile navigation"><a href="index.html">Home</a><a href="search.html">Search</a><a href="add-listing.html" class="mobile-sell">Sell</a><a href="account.html">Account</a></nav>';
    }
    try{
      const cfg=window.TROTRO_SUPABASE_CONFIG||{};
      if(!cfg.url||!cfg.key)return;
      const r=await fetch(cfg.url+'/rest/v1/listings?select=*&status=eq.active&order=created_at.desc',{headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key}});
      if(!r.ok)return;
      const rows=await r.json();
      const latest=document.getElementById('latest');
      if(latest && !latest.children.length && rows.length){
        latest.innerHTML=rows.slice(0,12).map(x=>'<article class="card"><a href="listing.html?id='+encodeURIComponent(x.id)+'"><div class="card-img"><img loading="lazy" src="'+esc(Array.isArray(x.images)&&x.images[0]?x.images[0]:'assets/images/logo.png')+'" alt="'+esc(x.title)+'"></div><div class="card-body"><div class="card-title">'+esc(x.title)+'</div><div class="price">'+esc(D.settings.currency||'GH₵')+' '+esc(x.price)+'</div><div class="meta"><span>'+esc(x.location)+'</span><span>'+esc(x.category)+'</span></div></div></a></article>').join('');
      }
    }catch(e){console.error(e)}
  },700);
});
</script></body></html>
